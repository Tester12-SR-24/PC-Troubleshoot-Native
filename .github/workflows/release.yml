name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: windows
            package: package:windows
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            package: package:linux
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux
            package: package:linux
    runs-on: ${{ matrix.os }}
    env:
      PC_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Validate SemVer release version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version v$version and must not contain build metadata." >&2
            exit 1
          fi
      - run: npm run ${{ matrix.package }}
        shell: bash
        if: matrix.platform == 'linux'
      - run: npm run ${{ matrix.package }}
        shell: pwsh
        if: matrix.platform == 'windows'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
