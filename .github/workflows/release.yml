name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish, for example v0.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: Linux x64
            os: ubuntu-22.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      PC_RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate SemVer release version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          project_version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' native/PC.Troubleshoot.Desktop/PC.Troubleshoot.Desktop.csproj | head -n 1)"
          if [[ "$version" != "$project_version" ]]; then
            echo "Selected tag $RELEASE_TAG does not match native app version $project_version." >&2
            exit 1
          fi
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libice6 libsm6 libfontconfig1
      - name: Build native package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Build native package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: release-assets/*
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: PC Troubleshoot ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          allowUpdates: true

